[project]
name = "youtube-poop-maker"
version = "0.1.0"
description = "Sentence-mixing editor for YouTube Poops"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",
    "imageio-ffmpeg>=0.5",
    "numpy>=1.24",
    "faster-whisper>=1.0",
]

[project.scripts]
ytp = "ytp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ytp"]
